# Copie para <user>/<user>/.github/workflows/. Publica widgets vivos na branch "output".
# Confira as majors atuais antes: git ls-remote --tags https://github.com/<action>
name: Widgets do perfil

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: widgets-do-perfil
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r tools/requirements.txt

      # Geradores Python ANTES do snk: o snk roda em container e deixa dist/ como root.
      - name: Contador de visitas
        run: >
          python tools/visits.py dist --user ${{ github.repository_owner }}
          --display tools/fonts/DISPLAY.ttf --body tools/fonts/CORPO.ttf --theme tools/theme.json

      # ACENTO e os 5 tons (do vazio ao mais forte) saem do plano de design, com #.
      - name: Cobrinha nas cores do tema
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=ACENTO&color_dots=#161b22,TOM1,TOM2,TOM3,TOM4
            dist/snake-light.svg?color_snake=ACENTO&color_dots=#ebedf0,TOM1,TOM2,TOM3,TOM4

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza widgets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
